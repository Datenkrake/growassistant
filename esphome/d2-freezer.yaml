esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: WARN          # options: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE
  logs:
    wifi: WARN
# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: "4"
  password: "8AHQ972324Au394+"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "D2-Freezer Fallback Hotspot"
    password: "KBjOZYrlZ5bm"

captive_portal:
    
esphome:
  name: d2-freezer

####################################################################
# configure substitutions and friendly name
####################################################################

  area: ${area_id}
  friendly_name: ${area_id}_${device_id}${suffix}

# Note for pinout on ESP32-C3 Supermini:
# Pin Functions
# GPIO0 / A0 (bottom right corner in top view with USB port on the top)
# GPIO1 / A1
# GPIO2 / A2 (external pull-up resistor and is a boot related pin)
# GPIO3 / A3
# GPIO4 / A4 / SCK
# GPIO5 / A5 / MISO
# GPIO6 / MOSI
# GPIO7 / SS
# GPIO8 / SDA
# GPIO9 / SCL (external pull-down resistor and is a boot related pin "BOOT button")
# GPIO10
# GPIO20 / RX
# GPIO21 / TX

substitutions:
  area_id: D2
  device_id: "FREEZER"
  suffix: ""
  pin_sda: GPIO5
  pin_scl: GPIO6
  pin_fan_top_pwm: GPIO1
  pin_heater_pwm: GPIO0
  pin_fan_bot_pwm: GPIO3
  address_aht10_top: "0x38"
  address_sht21_bot: "0x40"


####################################################################
# generic yaml below
####################################################################
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "auto/${area_id}/${device_id}"
  log_topic: "debug/${area_id}/${device_id}"

time:
  - !include includes/time_mqtt.yaml

i2c:
  !include includes/i2c_bus_a.yaml

globals:
  - id: last_phase_global
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: heater_should_be_on
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: D2_FREEZER_heater_duty_cycle
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ${area_id}_${device_id}${suffix}_fan_top_pwm_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ${area_id}_${device_id}${suffix}_fan_bot_pwm_value
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ${area_id}_${device_id}${suffix}_fan_speed_step
    type: int
    restore_value: no
    initial_value: '0'
  - id: G3D_BRAIN_target_temp
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: G3D_BRAIN_target_humidity
    type: float
    restore_value: no
    initial_value: '0.0'

output:
  - platform: ledc
    pin: ${pin_fan_top_pwm}
    id: ${area_id}_${device_id}${suffix}_fan_top_pwm
    frequency: 25000 Hz
    inverted: True
    max_power: 1.0
  - platform: ledc
    pin: ${pin_heater_pwm}
    id: ${area_id}_${device_id}${suffix}_heater_pwm
    frequency: 25000 Hz
    inverted: False
    max_power: 0.8
  - platform: ledc
    pin: ${pin_fan_bot_pwm}
    id: ${area_id}_${device_id}${suffix}_fan_bot_pwm
    frequency: 25000 Hz
    
fan:
  - platform: speed
    output: ${area_id}_${device_id}${suffix}_fan_top_pwm
    name: "Circulation Fan [${area_id}${suffix}]"
    id: ${area_id}_${device_id}${suffix}_fan_top
    state_topic: "${area_id}/fan/state/FANTOP"
    speed_state_topic: "${area_id}/fan/speed/FANTOP"
    command_topic: "${area_id}/${device_id}/fan/state/FANTOP/set"
    speed_command_topic: "${area_id}/fan/speed/FANTOP/set"
    restore_mode: ALWAYS_ON  # Options: ALWAYS_OFF, ALWAYS_ON, RESTORE_DEFAULT_OFF, RESTORE_DEFAULT_ON, RESTORE_INVERTED_DEFAULT_OFF, RESTORE_INVERTED_DEFAULT_ON
    speed_count: 100
    on_turn_on:
      - fan.turn_on:
          id: ${area_id}_${device_id}${suffix}_fan_top
          speed: 50

  - platform: speed
    output: ${area_id}_${device_id}${suffix}_heater_pwm
    name: "Heater Fan [${area_id}${suffix}]"
    id: ${area_id}_${device_id}${suffix}_heater
    state_topic: "${area_id}/heater/state/PTC"
    speed_state_topic: "${area_id}/heater/speed/PTC"
    command_topic: "${area_id}/${device_id}/heater/state/PTC/set"
    speed_command_topic: "${area_id}/heater/speed/PTC/set"
    restore_mode: ALWAYS_OFF  # Options: ALWAYS_OFF, ALWAYS_ON, RESTORE_DEFAULT_OFF, RESTORE_DEFAULT_ON, RESTORE_INVERTED_DEFAULT_OFF, RESTORE_INVERTED_DEFAULT_ON
    speed_count: 100

  - platform: speed
    output: ${area_id}_${device_id}${suffix}_fan_bot_pwm
    name: "Intake Fan [${area_id}${suffix}]"
    id: ${area_id}_${device_id}${suffix}_fan_bot
    state_topic: "${area_id}/fan/state/FANBOT"
    speed_state_topic: "${area_id}/fan/speed/FANBOT"
    command_topic: "${area_id}/${device_id}/fan/state/FANBOT/set"
    speed_command_topic: "${area_id}/fan/speed/FANBOT/set"
    restore_mode: ALWAYS_ON  # Options: ALWAYS_OFF, ALWAYS_ON, RESTORE_DEFAULT_OFF, RESTORE_DEFAULT_ON, RESTORE_INVERTED_DEFAULT_OFF, RESTORE_INVERTED_DEFAULT_ON
    speed_count: 100

sensor:
  # PHYSICAL SENSORS
  ## TEMPERATURE, HUMIDITY
  - platform: sht4x
    i2c_id: bus_a
    address: 0x44
    temperature:
        name: "Temperature SHT TOP [${area_id}_${device_id}${suffix}]"
        id: ${area_id}_${device_id}${suffix}_temperature_aht_top
        state_topic: "${area_id}/temperature/state/SHTTOP"
        filters:
          - median:
              window_size: 5
              send_every: 1
          - sliding_window_moving_average:
              window_size: 10
              send_every: 1
    humidity:
        name: "Humidity SHT TOP [${area_id}_${device_id}${suffix}]"
        id: ${area_id}_${device_id}${suffix}_humidity_aht_top
        state_topic: "${area_id}/humidity/state/SHTTOP"
        filters:
          - median:
              window_size: 5
              send_every: 1
          - sliding_window_moving_average:
              window_size: 10
              send_every: 1
    precision: High
    heater_max_duty: 0.0
    update_interval: 1s

  - platform: htu21d
    i2c_id: bus_a
    address: ${address_sht21_bot}
    temperature:
        name: "Temperature SHT21 [${area_id}_${device_id}${suffix}]"
        id: ${area_id}_${device_id}${suffix}_temperature_aht_bot
        state_topic: "${area_id}/temperature/state/SHTBOT"
        filters:
          - median:
              window_size: 5  # Adjust as needed to remove outliers
              send_every: 1
          - sliding_window_moving_average:
              window_size: 10  # 10 samples at 1s intervals = 10s average
              send_every: 1
          - timeout:
              timeout: 10s
              value: !lambda "return {};"
        on_value:
          then:
            - lambda: |-
                static float last_temp = NAN;
                static int stuck_count = 0;
                float current = x;
                
                // Check if sensor is stuck (same value for multiple readings)
                if (!isnan(last_temp) && abs(current - last_temp) < 0.01) {
                  stuck_count++;
                  if (stuck_count > 30) {  // Stuck for 30 readings
                    ESP_LOGW("sht21", "Temperature stuck at %.2f, sensor may need power cycle", current);
                    stuck_count = 0;  // Reset counter
                  }
                } else {
                  stuck_count = 0;
                }
                last_temp = current;
    humidity:
        name: "Humidity SHT21 BOT [${area_id}_${device_id}${suffix}]"
        id: ${area_id}_${device_id}${suffix}_humidity_aht_bot
        state_topic: "${area_id}/humidity/state/SHTBOT"
        filters:
          - median:
              window_size: 5  # Adjust as needed to remove outliers
              send_every: 1
          - sliding_window_moving_average:
              window_size: 10  # 10 samples at 1s intervals = 10s average
              send_every: 1
          - timeout:
              timeout: 10s
              value: !lambda "return {};"
        on_value:
          then:
            - lambda: |-
                static float last_rh = NAN;
                static int stuck_count = 0;
                float current = x;
                
                // Check if sensor is stuck (same value for multiple readings)
                if (!isnan(last_rh) && abs(current - last_rh) < 0.01) {
                  stuck_count++;
                  if (stuck_count > 30) {  // Stuck for 30 readings
                    ESP_LOGW("sht21", "Humidity stuck at %.2f%%, sensor may need power cycle", current);
                    stuck_count = 0;  // Reset counter
                  }
                } else {
                  stuck_count = 0;
                }
                last_rh = current;
    update_interval: 3s  # Reduced from 1s to prevent sensor lockup

  # CALCULATED SENSORS
  ## CLIMATE
  - platform: template
    name: "VPD TOP [${area_id}_${device_id}${suffix}]"
    id: ${area_id}_${device_id}${suffix}_vpd_top
    state_topic: "${area_id}/vpd/state/TOP"
    unit_of_measurement: "kPa"
    update_interval: 10s
    accuracy_decimals: 2
    lambda: |
        float LT = id(${area_id}_${device_id}${suffix}_temperature_aht_top).state;
        float rh = id(${area_id}_${device_id}${suffix}_humidity_aht_top).state;
        float ASVP = 610.78 * exp((LT / (LT + 237.3)) * 17.2694);
        float LSVP = 610.78 * exp((LT / (LT + 237.3)) * 17.2694);
        float LVPD = (LSVP - (ASVP * (rh / 100.0))) / 1000.0;
        return LVPD;

  - platform: template
    name: "VPD BOT [${area_id}_${device_id}${suffix}]"
    id: ${area_id}_${device_id}${suffix}_vpd_bot
    state_topic: "${area_id}/vpd/state/BOT"
    unit_of_measurement: "kPa"
    update_interval: 10s
    accuracy_decimals: 2
    lambda: |
        float LT = id(${area_id}_${device_id}${suffix}_temperature_aht_bot).state;
        float rh = id(${area_id}_${device_id}${suffix}_humidity_aht_bot).state;
        float ASVP = 610.78 * exp((LT / (LT + 237.3)) * 17.2694);
        float LSVP = 610.78 * exp((LT / (LT + 237.3)) * 17.2694);
        float LVPD = (LSVP - (ASVP * (rh / 100.0))) / 1000.0;
        return LVPD;


number:
  - !include includes/number_start_date.yaml

# This could be placed inside a script: or automation:
interval:
  - interval: 10s
    then:
      # ------------------------------------------------------------------
      # 1️⃣ Run another script (e.g., to adjust the drytower)
      # ------------------------------------------------------------------
      - script.execute: adjust_drytower

      # ------------------------------------------------------------------
      # 2️⃣ Heater PWM control – apply duty cycle from global variable
      # ------------------------------------------------------------------
      - lambda: |-
          float duty = id(D2_FREEZER_heater_duty_cycle);
          bool heater_on = id(heater_should_be_on);
          
          if (heater_on && duty > 0.01) {
            // Apply duty cycle to heater PWM
            id(${area_id}_${device_id}${suffix}_heater_pwm).set_level(duty);
            ESP_LOGD("interval", "Heater PWM set to %.1f%%", duty * 100.0);
          } else {
            // Turn off heater
            id(${area_id}_${device_id}${suffix}_heater_pwm).set_level(0.0);
            ESP_LOGD("interval", "Heater OFF");
          }

                
script:
  - !include includes/script_adjust_drytower.yaml
